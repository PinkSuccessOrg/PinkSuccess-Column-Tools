<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PinkSuccess Tools</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-welcome ms-Fabric">
  <main class="ms-welcome__main">
    <h2 class="ms-font-xl">Column Tools</h2>
    <p class="ms-font-s">Operates on the active sheet.</p>

    <h3 class="ms-font-l">Presets</h3>
    <div id="presets"></div>

    <h3 class="ms-font-l">Custom</h3>
    <label class="ms-Label">Headers (comma-separated):</label>
    <input type="text" id="custom-headers" class="ms-TextField-field"
           placeholder="Name, Email, Phone" />
    <button class="ms-Button" id="run-keep-order">Keep & Reorder</button>
    <button class="ms-Button" id="run-keep-set">Keep (preserve order)</button>
    <button class="ms-Button" id="run-remove">Remove</button>

    <p id="status" class="ms-font-s" style="margin-top: 1em;"></p>
  </main>
</body>

</html>
